databases:
  - name: health_care_online_system_db
    databaseName: health_care_online_system
    user: health_care_online_system
    plan: free

services:
  - type: web
    name: health_care_online_system
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: health_care_online_system_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false